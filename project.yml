# xcodegen project spec — HermesMini (native SwiftUI)
# Generate with: xcodegen generate
# Then open HermesMini.xcodeproj in Xcode

name: HermesMini
options:
  bundleIdPrefix: com.cmm
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: "131"
targets:
  HermesMini:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HermesMini
        excludes:
          - "Resources/AlternateIcons/**"
      - path: HermesMini/Resources/AlternateIcons
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmm.hermesmini
        PRODUCT_NAME: HermesMini
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HermesMini/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: HermesMini/Conduit.entitlements
  HermesMiniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HermesMiniTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HermesMini
  HermesMiniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HermesMiniUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HermesMini
